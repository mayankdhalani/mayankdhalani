<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1429">
<meta name="description" content="Thoughts in Starry Nights — poetry by Mayank Dhalani. Coming soon.">
<title>Thoughts in Starry Nights — Mayank Dhalani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f5eddd;--muted:#c2c5d0;--gold:#d9b985}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:#0b1429;color:var(--ink);font:400 15px/1.8 "DM Sans",sans-serif;overflow-x:hidden}
a{color:inherit}a:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 75% 26%,#314067 0%,transparent 39%),radial-gradient(ellipse at 20% 70%,#172a4b 0%,transparent 55%),linear-gradient(165deg,#080e21 0%,#111d37 66%,#202c42 100%)}
.sky:before,.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(1.3px 1.3px at 9% 14%,#fff 95%,transparent),radial-gradient(1px 1px at 20% 48%,#fff 95%,transparent),radial-gradient(2px 2px at 33% 17%,#fff 95%,transparent),radial-gradient(1px 1px at 44% 63%,#fff 95%,transparent),radial-gradient(1.5px 1.5px at 59% 11%,#fff 95%,transparent),radial-gradient(1px 1px at 76% 40%,#fff 95%,transparent),radial-gradient(2px 2px at 88% 22%,#fff 95%,transparent),radial-gradient(1px 1px at 94% 68%,#fff 95%,transparent),radial-gradient(1px 1px at 12% 83%,#fff 95%,transparent),radial-gradient(1.5px 1.5px at 67% 81%,#fff 95%,transparent);opacity:.8}
.sky:after{transform:scale(1.25) rotate(17deg);opacity:.34}
header{width:min(1160px,calc(100% - 50px));margin:auto;min-height:91px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #e9dfca25}
.brand{text-decoration:none;font:400 23px/1.2 "Playfair Display",Georgia,serif;letter-spacing:-.04em}.brand span{color:var(--gold)}
.back{text-decoration:none;font-size:12px;letter-spacing:.06em;color:#ded8c9}.back:hover,.wordpress:hover{color:var(--gold)}
main{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;position:relative;padding:90px 25px 115px;text-align:center}
.moon{position:absolute;top:8%;right:16%;width:92px;height:92px;border-radius:50%;background:#f0dfb9;box-shadow:0 0 45px #e6d6b64d,0 0 120px #e6d6b625;opacity:.85}
.content{position:relative;z-index:1;max-width:760px}
.eyebrow{font-size:10px;letter-spacing:.29em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font:400 clamp(57px,9vw,112px)/1.16 "Playfair Display",Georgia,serif;letter-spacing:-.055em;margin:25px 0 22px}
h1 em{font-weight:400;color:#e5c99b}
.rule{height:1px;width:65px;background:var(--gold);margin:34px auto}
.message{font:italic 400 clamp(18px,2.3vw,25px)/1.7 "Playfair Display",Georgia,serif;color:#e4dfd4;margin:0 auto 35px;max-width:580px}
.status{display:inline-block;border:1px solid #d9b98580;color:var(--gold);font-size:10px;font-weight:600;letter-spacing:.23em;text-transform:uppercase;padding:11px 19px;margin-bottom:34px}
.wordpress{display:inline-flex;align-items:center;gap:17px;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:7px;font-size:13px;font-weight:500}
.horizon{position:absolute;bottom:0;left:0;width:100%;height:160px;z-index:0;opacity:.55}
footer{width:min(1160px,calc(100% - 50px));margin:auto;display:flex;justify-content:space-between;gap:20px;border-top:1px solid #e9dfca25;padding:23px 0;color:#b1b7c1;font-size:11px}
@media(max-width:600px){header{min-height:75px}.brand{font-size:20px}main{padding:110px 22px 110px;min-height:calc(100svh - 140px)}.moon{width:60px;height:60px;top:9%;right:12%}h1{font-size:clamp(52px,13vw,77px)}footer{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header><a class="brand" href="../">Mayank Dhalani<span>.</span></a><a class="back" href="../">← Back home</a></header>
<main>
<div class="moon" aria-hidden="true"></div>
<div class="content">
<div class="eyebrow">A quiet corner of the universe</div>
<h1>Thoughts in<br><em>Starry Nights.</em></h1>
<div class="rule"></div>
<p class="message">For the thoughts that arrive after midnight, the feelings we cannot name, and the words we leave beneath the stars.</p>
<div class="status">Coming soon</div><br>
<a class="wordpress" href="https://mayankdhalani.wordpress.com/" target="_blank" rel="noopener noreferrer">Read my poetry on WordPress <span aria-hidden="true">↗</span></a>
</div>
<svg class="horizon" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="#070f20" d="M0 90Q130 62 220 98T440 103T660 96T880 85T1200 98V160H0Z"/><path fill="#0b1729" d="M0 112Q170 89 330 118T660 106T970 120T1200 110V160H0Z"/></svg>
</main>
<footer><span>© <span id="year">2026</span> Mayank Dhalani</span><span>Somewhere beneath the same sky.</span></footer>
<script>document.getElementById("year").textContent=new Date().getFullYear();</script>
</body></html>
